<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Sea of Links</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--sea:#0b16b8;--ink:#fff;--hot:#ffe14a}
html,body{margin:0;height:100%;background:var(--sea);overflow:hidden;color:var(--ink);font-family:"Courier New",monospace}
canvas{display:block}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
#cross{position:fixed;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid #fff;border-radius:50%;opacity:.75;pointer-events:none;transition:transform .15s}
#cross.on{transform:scale(2.2);border-color:var(--hot)}
#label{position:fixed;left:50%;top:calc(50% + 34px);transform:translateX(-50%);text-align:center;font-size:15px;pointer-events:none;text-shadow:0 0 6px #000;min-height:40px}
#label small{display:block;opacity:.7;font-size:12px}
#hud{position:fixed;left:14px;bottom:12px;font-size:12px;opacity:.75;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
#intro{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(6,10,90,.82);cursor:pointer;text-align:center;padding:24px}
#intro h1{margin:0;font-size:clamp(28px,6vw,64px);font-weight:700;letter-spacing:.02em}
#intro p{margin:0;max-width:460px;line-height:1.5;opacity:.9}
#intro b{border:2px solid #fff;padding:8px 18px;border-radius:999px}
@media (prefers-reduced-motion:reduce){#cross{transition:none}}
</style>
</head>
<body>
<div id="intro">
  <h1>The Sea of Links</h1>
  <p>Every window is a doorway to a website. Swim around, aim at one, click to dive in.</p>
  <p>W A S D move &nbsp; mouse look &nbsp; Q / E down / up &nbsp; Shift faster</p>
  <b>Click to start</b>
</div>
<div id="cross"></div>
<div id="label"></div>
<div id="hud">WASD move · mouse look · click a window to enter</div>
<div id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="sites.js"></script>
<script>
(()=>{
const COUNT=100, WORLD={x:75,y:30,z:75};
const $=id=>document.getElementById(id);

// ---------- data ----------
const list=(typeof SITES!=="undefined"?SITES:[]).slice(0,COUNT).map(s=>({title:s[0]||"Untitled",url:s[1]||"",image:s[2]||"",shape:s[3]||""}));
while(list.length<COUNT) list.push({title:"Placeholder "+String(list.length+1).padStart(3,"0"),url:"",image:"",shape:""});

// aspect ratio (width / height) per shape
const ASPECT={rect:1.4,round:1.25,oval:1.7,hex:1.1,fish:1.9,tall:.5,wide:3,whale:2.2};
const KINDS=["rect","rect","round","round","oval","hex","fish","fish","tall","wide","wide","whale"];

// name of the banner downloaded by fetch_banners.py (must match slug() there)
function autoImage(url){
  if(!url)return"";
  try{const u=new URL(url);
    const s=(u.hostname.replace(/^www\./,"")+u.pathname).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);
    return s?"images/"+s+".webp":"";}catch(_){return""}
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- scene ----------
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
// sea colors: lighter above, darker below; distant things fade toward the deep blue
const SEA_TOP=0x1b32d2, SEA_MID=0x0a1498, SEA_BOTTOM=0x030748, FOG=0x08117a;
scene.background=new THREE.Color(SEA_MID);
scene.fog=new THREE.Fog(FOG,12,115);
const dome=new THREE.Mesh(new THREE.SphereGeometry(250,24,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(SEA_TOP)},mid:{value:new THREE.Color(SEA_MID)},bot:{value:new THREE.Color(SEA_BOTTOM)}},
  vertexShader:"varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
  fragmentShader:"uniform vec3 top,mid,bot;varying vec3 d;void main(){float h=d.y*.5+.5;"+
    "vec3 c=mix(bot,mid,smoothstep(.12,.5,h));c=mix(c,top,smoothstep(.5,1.,h));gl_FragColor=vec4(c,1.);}"}));
dome.renderOrder=-1;scene.add(dome);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);
const START=new THREE.Vector3(0,0,62);
camera.position.copy(START);
camera.rotation.order="YXZ";

// plankton
{const n=900,p=new Float32Array(n*3),r=rng(5);
 for(let i=0;i<n;i++){p[i*3]=(r()-.5)*2*WORLD.x*1.3;p[i*3+1]=(r()-.5)*2*WORLD.y*1.5;p[i*3+2]=(r()-.5)*2*WORLD.z*1.3}
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(p,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x8fb0ff,size:.35,fog:true})));}

// ---------- window textures ----------
function path(c,kind,w,h){
  const m=4;c.beginPath();
  switch(kind){
    case"round":c.roundRect(m,m,w-2*m,h-2*m,Math.min(w,h)*.28);break;
    case"oval":c.ellipse(w/2,h/2,w/2-m,h/2-m,0,0,Math.PI*2);break;
    case"hex":{const k=w*.25;c.moveTo(k,m);c.lineTo(w-k,m);c.lineTo(w-m,h/2);c.lineTo(w-k,h-m);c.lineTo(k,h-m);c.lineTo(m,h/2);c.closePath();break}
    case"fish":case"whale":
      c.ellipse(w*.4,h/2,w*.4-m,h/2-m,0,0,Math.PI*2);
      c.moveTo(w*.7,h/2);c.lineTo(w-m,m);c.lineTo(w-m,h-m);c.closePath();break;
    default:c.rect(m,m,w-2*m,h-2*m);
  }
}
function paint(canvas,entry,i,kind,img){
  const c=canvas.getContext("2d"),w=canvas.width,h=canvas.height,r=rng(i*977+3),hue=(i*47)%360;
  c.clearRect(0,0,w,h);c.save();path(c,kind,w,h);c.clip();
  if(img){
    const s=Math.max(w/img.width,h/img.height);
    c.drawImage(img,(w-img.width*s)/2,(h-img.height*s)/2,img.width*s,img.height*s);
  }else{
    c.fillStyle=`hsl(${hue},65%,16%)`;c.fillRect(0,0,w,h);
    c.fillStyle=`hsl(${hue},90%,62%)`;c.fillRect(0,0,w,18);
    c.fillStyle="#fff";for(let k=0;k<3;k++)c.fillRect(8+k*12,6,7,7);
    for(let k=0;k<7;k++){c.fillStyle=`hsla(${(hue+r()*90)%360},85%,${45+r()*25}%,.85)`;
      c.fillRect(8+r()*w*.5,28+r()*(h-60),10+r()*w*.4,5+r()*14)}
    c.fillStyle="#fff";c.font="bold 15px 'Courier New',monospace";c.textAlign="center";c.textBaseline="middle";
    const fx=(kind==="fish"||kind==="whale")?w*.36:w/2;
    c.fillText(entry.title.slice(0,20),fx,h/2+6);
  }
  c.restore();
  path(c,kind,w,h);c.lineWidth=5;c.strokeStyle="#fff";c.stroke();
}

// ---------- build the sea ----------
const meshes=[],R=rng(11);
list.forEach((e,i)=>{
  const kind=ASPECT[e.shape]?e.shape:KINDS[Math.floor(R()*KINDS.length)];
  const asp=ASPECT[kind],big=kind==="whale";
  const hgt=big?11+R()*5:3.5+R()*3.5,wid=hgt*asp;
  const cw=192,ch=Math.max(64,Math.round(cw/asp));
  const canvas=document.createElement("canvas");canvas.width=cw;canvas.height=ch;
  paint(canvas,e,i,kind,null);
  const tex=new THREE.CanvasTexture(canvas);tex.minFilter=tex.magFilter=THREE.NearestFilter;
  const src=e.image||autoImage(e.url);          // manual image wins, else the downloaded banner
  if(src){const im=new Image();im.onload=()=>{paint(canvas,e,i,kind,im);tex.needsUpdate=true};
    if(e.image)im.onerror=()=>console.warn("Image not found:",e.image);im.src=src}
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(wid,hgt),
    new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.1,side:THREE.DoubleSide}));
  let p;do{p=new THREE.Vector3((R()-.5)*2*WORLD.x,(R()-.5)*2*WORLD.y,(R()-.5)*2*WORLD.z)}while(p.distanceTo(START)<14);
  mesh.position.copy(p);
  const sp=(big?.5:.4+R()*1.6)*(kind==="fish"?1.6:1);
  mesh.userData={entry:e,kind,vel:new THREE.Vector3(R()-.5,(R()-.5)*.3,R()-.5).normalize().multiplyScalar(sp),
    tilt:(R()-.5)*1.4,roll:(R()-.5)*.8,ph:R()*6.28,k:.3+R()*.5,base:1,flip:1};
  scene.add(mesh);meshes.push(mesh);
});

// ---------- signs (decoration: your own text panels with stickers; not links) ----------
const SIGN_PLACE={left:[0,.5],right:[1,.5],top:[.5,0],bottom:[.5,1],topleft:[0,0],topright:[1,0],bottomleft:[0,1],bottomright:[1,1],center:[.5,.5]};
const IMG_RE=/\.(png|jpe?g|gif|webp|svg)$/i;
function wrapText(c,t,maxW){
  const out=[];let cur="";
  for(const w of String(t).split(/\s+/)){const test=cur?cur+" "+w:w;
    if(c.measureText(test).width>maxW&&cur){out.push(cur);cur=w}else cur=test}
  if(cur)out.push(cur);return out;
}
function paintSign(cv,s,imgs){
  const c=cv.getContext("2d"),W=cv.width,H=cv.height,mx=32,my=24,pw=W-2*mx,ph=H-2*my,st=s.stickers||[];
  c.clearRect(0,0,W,H);c.lineJoin="round";
  c.save();c.translate(mx,my);path(c,s.shape||"round",pw,ph);                       // the panel
  c.fillStyle=s.bg||"#e8337f";c.fill();c.strokeStyle=s.outline||"#fff";c.lineWidth=5;c.stroke();c.restore();
  const padL=st.some(x=>x[1]==="left")?46:0,padR=st.some(x=>x[1]==="right")?46:0;     // leave room beside side stickers
  const maxW=pw-44-padL-padR,maxH=ph-34;
  c.fillStyle=s.color||"#fff";c.textAlign="center";c.textBaseline="middle";
  let size=52,lines=[];
  for(;size>=16;size-=3){c.font='bold '+size+'px "Courier New",monospace';lines=wrapText(c,s.text||"",maxW);
    if(lines.length*size*1.18<=maxH)break}                                              // shrink until the text fits
  const cx=mx+pw/2+(padL-padR)/2,y0=my+ph/2-(lines.length-1)*size*1.18/2;
  lines.forEach((l,i)=>c.fillText(l,cx,y0+i*size*1.18));
  st.forEach(([sticker,place],i)=>{                                                      // stickers sit on the panel edge
    const [fx,fy]=SIGN_PLACE[place]||SIGN_PLACE.center,img=imgs[i];
    const x=mx+pw*fx+(fx===0?12:fx===1?-12:0),y=my+ph*fy+(fy===0?10:fy===1?-10:0);
    c.save();c.translate(x,y);c.rotate(i%2?.18:-.16);c.shadowColor="#fff";c.shadowBlur=5;
    for(let k=0;k<3;k++){                                                                // 3 passes make the white sticker border solid
      if(img){if(img.complete&&img.naturalWidth){const k2=76/Math.max(img.naturalWidth,img.naturalHeight);
        c.drawImage(img,-img.naturalWidth*k2/2,-img.naturalHeight*k2/2,img.naturalWidth*k2,img.naturalHeight*k2)}}
      else{c.font='60px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';c.fillText(sticker,0,4)}
    }
    c.restore();
  });
}
const signMeshes=[],SR=rng(21);
(typeof SIGNS!=="undefined"?SIGNS:[]).forEach(s=>{
  const cv=document.createElement("canvas");cv.width=448;cv.height=208;
  const tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;             // smooth, so text stays readable
  const imgs=(s.stickers||[]).map(([sticker])=>{
    if(!IMG_RE.test(sticker))return null;
    const im=new Image();im.onload=()=>{paintSign(cv,s,imgs);tex.needsUpdate=true};
    im.onerror=()=>console.warn("Sticker not found:",sticker);im.src=sticker;return im;});
  paintSign(cv,s,imgs);
  const h=s.size||4.6,mesh=new THREE.Mesh(new THREE.PlaneGeometry(h*448/208,h),
    new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.05,side:THREE.DoubleSide}));
  let p;do{p=new THREE.Vector3((SR()-.5)*2*WORLD.x,(SR()-.5)*2*WORLD.y,(SR()-.5)*2*WORLD.z)}while(p.distanceTo(START)<14);
  mesh.position.copy(p);
  mesh.userData={vel:new THREE.Vector3(SR()-.5,(SR()-.5)*.2,SR()-.5).normalize().multiplyScalar(.3+SR()*.5),
    tilt:(SR()-.5)*.9,roll:(SR()-.5)*.3,ph:SR()*6.28,k:.3+SR()*.4};
  scene.add(mesh);signMeshes.push(mesh);
});

// ---------- swimmers (decoration only: smaller than windows, not clickable) ----------
const SWIMMERS=40;
const VARS=[{k:"octopus",c:"#e8337f"},{k:"octopus",c:"#8a3dd8"},{k:"squid",c:"#ff7a2e"},
  {k:"jelly",c:"#b46cff"},{k:"jelly",c:"#35d0e0"},{k:"whale",c:"#4fa3ff",w:.5},{k:"shark",c:"#9db0e0",w:.5},{k:"fish",c:"#ff9a2e"},{k:"fish",c:"#47e08a"}];
function critterTex(v,f){
  const cv=document.createElement("canvas");cv.width=cv.height=128;
  const c=cv.getContext("2d"),col=v.c,sg=f?1:-1;
  c.lineCap=c.lineJoin="round";
  const fill=()=>{c.fillStyle=col;c.fill();c.strokeStyle="#fff";c.lineWidth=5;c.stroke()};
  const legs=L=>{[["#fff",15],[col,8]].forEach(([s,w])=>{c.strokeStyle=s;c.lineWidth=w;
    L.forEach(([x0,y0,x1,y1,a],i)=>{const q=a*sg*(i%2?1:-1);c.beginPath();c.moveTo(x0,y0);
      c.bezierCurveTo(x0+q,y0+(y1-y0)/3,x1-q,y0+2*(y1-y0)/3,x1,y1);c.stroke()})})};
  const eye=(x,y)=>{c.fillStyle="#fff";c.fillRect(x-4,y-4,8,8);c.fillStyle="#102";c.fillRect(x-1,y-1,3,3)};
  const line=(p,w1,w2)=>{[["#fff",w1],[col,w2]].forEach(([s,w])=>{c.strokeStyle=s;c.lineWidth=w;c.beginPath();p.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke()})};
  if(v.k==="octopus"){
    legs([0,1,2,3,4,5].map(i=>[44+i*8,66,18+i*18.5,118,12]));
    c.beginPath();c.ellipse(64,44,26,29,0,0,7);fill();eye(54,42);eye(74,42);
  }else if(v.k==="squid"){
    legs([0,1,2,3].map(i=>[53+i*7.5,80,44+i*13,122,8]));
    c.beginPath();c.moveTo(64,4);c.lineTo(34,38);c.lineTo(94,38);c.closePath();fill();
    c.beginPath();c.ellipse(64,48,17,36,0,0,7);fill();eye(57,52);eye(71,52);
  }else if(v.k==="jelly"){
    legs([0,1,2,3,4].map(i=>[34+i*15,56,30+i*17,122,9]));
    c.beginPath();c.arc(64,56,36,Math.PI,0);c.closePath();fill();eye(52,44);eye(76,44);
  }else if(v.k==="whale"){
    const ty=f?6:-6;
    c.beginPath();c.moveTo(92,62);c.lineTo(108,60+ty);c.lineTo(124,40+ty);c.lineTo(120,62+ty);c.lineTo(126,86+ty);c.lineTo(108,68+ty);c.lineTo(92,76);c.closePath();fill();   // tail
    c.beginPath();c.moveTo(48,86);c.lineTo(36,110);c.lineTo(68,90);c.closePath();fill();       // flipper
    c.beginPath();c.ellipse(56,68,46,26,0,0,7);fill();                                        // body
    c.fillStyle="rgba(255,255,255,.28)";c.beginPath();c.ellipse(54,80,30,7,0,0,7);c.fill();    // pale belly
    eye(26,62);
    if(f){c.fillStyle="#fff";c.fillRect(56,28,4,10);c.fillRect(48,22,4,4);c.fillRect(64,22,4,4)}   // spout (frame 2 only)
  }else if(v.k==="shark"){
    const ty=f?6:-6;
    c.beginPath();c.moveTo(98,64);c.lineTo(122,38+ty);c.lineTo(112,68);c.lineTo(118,96+ty);c.lineTo(98,72);c.closePath();fill();   // tail
    c.beginPath();c.moveTo(54,50);c.lineTo(66,22);c.lineTo(80,52);c.closePath();fill();        // dorsal fin
    c.beginPath();c.moveTo(44,78);c.lineTo(36,102);c.lineTo(62,80);c.closePath();fill();       // pectoral fin
    c.beginPath();c.moveTo(8,68);c.quadraticCurveTo(30,44,70,50);c.quadraticCurveTo(92,54,104,64);
    c.lineTo(104,72);c.quadraticCurveTo(80,84,50,82);c.quadraticCurveTo(22,80,8,68);c.closePath();fill();   // body
    c.strokeStyle="#fff";c.lineWidth=2;
    for(let i=0;i<3;i++){c.beginPath();c.moveTo(36+i*6,60);c.lineTo(34+i*6,68);c.stroke()}      // gills
    c.beginPath();c.moveTo(10,70);c.lineTo(26,74);c.stroke();                                  // mouth
    eye(22,62);
  }else{
    const ty=f?8:-8;
    c.beginPath();c.moveTo(86,64);c.lineTo(118,40+ty);c.lineTo(118,88+ty);c.closePath();fill();
    c.beginPath();c.ellipse(56,64,36,23,0,0,7);fill();eye(36,58);
  }
  const t=new THREE.CanvasTexture(cv);t.minFilter=t.magFilter=THREE.NearestFilter;return t;
}
const critTex=VARS.map(v=>[0,1].map(f=>critterTex(v,f)));
const crit=[],C=rng(99);
for(let i=0;i<SWIMMERS;i++){
  let vi;do{vi=Math.floor(C()*VARS.length)}while(C()>(VARS[vi].w||1));const k=VARS[vi].k;
  const sz=k==="whale"?3+C()*1.2:k==="shark"?2.3+C()*1.0:k==="fish"?1.3+C()*1.1:k==="octopus"?2.2+C()*1.3:1.8+C()*1.4;   // windows are 3.5+ tall
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:critTex[vi][0],alphaTest:.1}));
  s.scale.set(sz,sz,1);
  s.position.set((C()-.5)*2*WORLD.x,(C()-.5)*2*WORLD.y,(C()-.5)*2*WORLD.z);
  const a=C()*6.28;
  s.userData={vi,k,sz,ph:C()*6.28,rate:2+C()*1.5,sp:k==="whale"?.8+C()*.6:k==="shark"?3+C()*1.5:1.8+C()*2.6,frame:0,flip:1,
    dir:new THREE.Vector3(Math.cos(a),(C()-.5)*.5,Math.sin(a)).normalize()};
  scene.add(s);crit.push(s);
}

// ---------- controls ----------
let yaw=0,pitch=0,active=false,locked=false,entering=null,drag=null,hover=null;
const keys={},vel=new THREE.Vector3(),mouse=new THREE.Vector2(0,0);
addEventListener("keydown",e=>{keys[e.code]=true});
addEventListener("keyup",e=>{keys[e.code]=false});
const intro=$("intro");
intro.addEventListener("click",()=>{
  active=true;intro.style.display="none";
  try{renderer.domElement.requestPointerLock()}catch(_){}
});
document.addEventListener("pointerlockchange",()=>{
  locked=document.pointerLockElement===renderer.domElement;
  if(!locked&&active&&!entering&&!drag)intro.style.display="flex",active=false;
});
function look(dx,dy){yaw-=dx*.0022;pitch=Math.max(-1.5,Math.min(1.5,pitch-dy*.0022))}
addEventListener("mousemove",e=>{
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  if(!active||entering)return;
  if(locked)look(e.movementX,e.movementY);
  else if(drag){look(e.movementX,e.movementY)}
});
renderer.domElement.addEventListener("mousedown",e=>{if(active&&!locked)drag={x:e.clientX,y:e.clientY,moved:false}});
addEventListener("mouseup",e=>{
  if(!active||entering)return;
  const wasClick=locked||(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5);
  drag=null;
  if(wasClick&&hover)enter(hover);
});

// ---------- entering a window ----------
const flash=$("flash");
function enter(mesh){
  const e=mesh.userData.entry;
  const dir=mesh.position.clone().sub(camera.position);
  entering={mesh,t:0,from:camera.position.clone(),to:mesh.position.clone().sub(dir.clone().setLength(1.2)),
    fov:camera.fov,url:e.url};
}
function stepEnter(dt){
  const s=entering;s.t+=dt/1.3;
  const k=Math.min(s.t,1),ease=k*k*k;                    // accelerating dive
  camera.position.lerpVectors(s.from,s.to,ease);
  camera.fov=s.fov+ease*70;camera.updateProjectionMatrix();
  flash.style.opacity=Math.max(0,(k-.65)/.35);
  if(k>=1){
    if(s.url){
      if(typeof NEW_TAB!=="undefined"&&NEW_TAB){window.open(s.url,"_blank");reset()}
      else{location.href=s.url}
    }else{reset();toast("No address yet for this window")}
  }
}
function reset(){camera.position.copy(START);camera.fov=70;camera.updateProjectionMatrix();entering=null;vel.set(0,0,0)}
let toastT=0;
function toast(t){const l=$("label");l.innerHTML=t;toastT=2}
addEventListener("pageshow",e=>{if(e.persisted)location.reload()});

// ---------- loop ----------
const ray=new THREE.Raycaster(),fwd=new THREE.Vector3(),rgt=new THREE.Vector3(),up=new THREE.Vector3(0,1,0),camR=new THREE.Vector3();
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05),t=now/1000;last=now;

  if(active&&!entering){
    camera.rotation.set(pitch,yaw,0);
    camera.getWorldDirection(fwd);rgt.crossVectors(fwd,up).normalize();
    const sp=(keys.ShiftLeft||keys.ShiftRight?26:11),want=new THREE.Vector3();
    if(keys.KeyW||keys.ArrowUp)want.add(fwd);if(keys.KeyS||keys.ArrowDown)want.sub(fwd);
    if(keys.KeyD||keys.ArrowRight)want.add(rgt);if(keys.KeyA||keys.ArrowLeft)want.sub(rgt);
    if(keys.KeyE||keys.Space)want.y+=1;if(keys.KeyQ||keys.KeyC)want.y-=1;
    if(want.lengthSq())want.normalize().multiplyScalar(sp);
    vel.lerp(want,1-Math.exp(-4*dt));
    camera.position.addScaledVector(vel,dt);
    camera.position.x=Math.max(-WORLD.x*1.3,Math.min(WORLD.x*1.3,camera.position.x));
    camera.position.y=Math.max(-WORLD.y*1.4,Math.min(WORLD.y*1.4,camera.position.y));
    camera.position.z=Math.max(-WORLD.z*1.3,Math.min(WORLD.z*1.3,camera.position.z));
  }
  if(entering)stepEnter(dt);
  else if(+flash.style.opacity>0)flash.style.opacity=Math.max(0,+flash.style.opacity-dt*1.5);

  camR.setFromMatrixColumn(camera.matrixWorld,0);
  for(const m of meshes){
    const u=m.userData;
    m.position.addScaledVector(u.vel,dt);
    if(Math.abs(m.position.x)>WORLD.x)u.vel.x*=-Math.sign(m.position.x*u.vel.x);
    if(Math.abs(m.position.y)>WORLD.y)u.vel.y*=-Math.sign(m.position.y*u.vel.y);
    if(Math.abs(m.position.z)>WORLD.z)u.vel.z*=-Math.sign(m.position.z*u.vel.z);
    m.lookAt(camera.position);                      // face the visitor, then tilt
    m.rotateY(u.tilt+Math.sin(t*u.k+u.ph)*.25);
    m.rotateZ(u.roll*.5+Math.sin(t*u.k*.7+u.ph)*.08);
    if(u.kind==="fish"||u.kind==="whale")u.flip=u.vel.dot(camR)>0?-1:1;
    const s=u.base*(m===hover?1.12:1);
    m.scale.set(s*u.flip,s,1);
    m.material.color.setHex(m===hover?0xffee88:0xffffff);
  }

  for(const m of signMeshes){                      // signs drift, face you, never clickable
    const u=m.userData;m.position.addScaledVector(u.vel,dt);
    if(Math.abs(m.position.x)>WORLD.x)u.vel.x*=-Math.sign(m.position.x*u.vel.x);
    if(Math.abs(m.position.y)>WORLD.y)u.vel.y*=-Math.sign(m.position.y*u.vel.y);
    if(Math.abs(m.position.z)>WORLD.z)u.vel.z*=-Math.sign(m.position.z*u.vel.z);
    m.lookAt(camera.position);m.rotateY(u.tilt+Math.sin(t*u.k+u.ph)*.2);m.rotateZ(u.roll+Math.sin(t*u.k*.7+u.ph)*.05);
  }
  // swimmers: pulse, surge, wander (never hit by the aim ray)
  for(const s of crit){
    const u=s.userData,cyc=Math.sin(t*u.rate+u.ph),fish=u.k==="fish"||u.k==="whale"||u.k==="shark";
    s.position.addScaledVector(u.dir,u.sp*(fish?1:.3+.7*Math.max(0,cyc))*dt);
    u.dir.applyAxisAngle(up,dt*.5*Math.sin(t*.2+u.ph));
    if(Math.abs(s.position.x)>WORLD.x*1.1)u.dir.x*=-Math.sign(s.position.x*u.dir.x);
    if(Math.abs(s.position.y)>WORLD.y*1.1)u.dir.y*=-Math.sign(s.position.y*u.dir.y);
    if(Math.abs(s.position.z)>WORLD.z*1.1)u.dir.z*=-Math.sign(s.position.z*u.dir.z);
    const f=cyc>0?1:0;
    if(f!==u.frame){u.frame=f;s.material.map=critTex[u.vi][f]}
    if(fish)u.flip=u.dir.dot(camR)>0?-1:1;
    const sq=fish?0:cyc*.1;
    s.scale.set(u.sz*(1-sq)*u.flip,u.sz*(1+sq),1);
  }

  // aim
  if(active&&!entering){
    ray.setFromCamera(locked?{x:0,y:0}:mouse,camera);
    const hit=ray.intersectObjects(meshes,false)[0];
    hover=hit&&hit.distance<70?hit.object:null;
  }else hover=null;
  $("cross").classList.toggle("on",!!hover);
  if(toastT>0)toastT-=dt;
  else if(hover){const e=hover.userData.entry;
    $("label").innerHTML=e.title+"<small>"+(e.url?e.url.replace(/^https?:\/\//,""):"no address yet")+"</small>"}
  else $("label").innerHTML="";

  dome.position.copy(camera.position);
  renderer.render(scene,camera);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
