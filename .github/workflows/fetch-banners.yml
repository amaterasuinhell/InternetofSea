name: Fetch banners

# Runs when sites.js changes, or when you press "Run workflow" in the Actions tab.
on:
  push:
    paths: ["sites.js"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python fetch_banners.py
      - name: Save new banners to the repo
        run: |
          git config user.name "banner-bot"
          git config user.email "banner-bot@users.noreply.github.com"
          git add images
          git diff --cached --quiet || (git commit -m "Update banners" && git push)
